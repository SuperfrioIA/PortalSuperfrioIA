       qrcode.js (mesma pasta, sem CDN). Substitui o qrcodejs de CDN, que
       dimensionava o QR contando caracteres e o gravava em bytes UTF-8:

  <script src="qrcode.js?v=1"></script>
  <style>
    :root {
      /* Blues */
      --brand-azul-institucional: #071A3A;
      --brand-azul-corporativo:   #0A2A5E;
      --brand-azul-principal:     #1E6FD9;
      --brand-azul-conexao:       #3FA9F5;
      /* Yellows */
      --brand-amarelo:            #FFC400;
      --brand-amarelo-suave:      #FFD84D;
      /* Neutrals */
      --brand-branco:             #FFFFFF;
      --brand-cinza-claro:        #C7D2E3;
      --brand-azul-escuro:        #050F24;
      /* Gradients */
      --grad-institucional: linear-gradient(135deg, #050F24 0%, #071A3A 50%, #0A2A5E 100%);
      --grad-conexao:       linear-gradient(135deg, #1E6FD9 0%, #3FA9F5 100%);
      /* Typography */
      --font-primary: 'Montserrat', sans-serif;
      /* Radius & shadow */
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 8px rgba(7,26,58,.12);
      --shadow-md: 0 6px 20px rgba(7,26,58,.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-primary);
      background: #F7F9FC;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      color: var(--brand-azul-institucional);
      position: relative; overflow-x: hidden;
    }
    /* onda decorativa no rodape (motivo de marca, sutil) */
    .ondas { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 150px; z-index: 0; pointer-events: none; }
    .container {
      position: relative; z-index: 1;
      background: var(--brand-branco);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      width: 100%; max-width: 430px; overflow: hidden;
      border: 1px solid rgba(199,210,227,.6);
    }
    .brand {
      background: #F0F4FA;
      border-bottom: 1px solid rgba(199,210,227,.7);
      padding: 18px 28px 16px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .brand img.logo { height: 38px; width: auto; display: block; }
    .brand .accent { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: var(--grad-conexao); }
    .content { padding: 24px 28px 28px; position: relative; }
    .titlebar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .titlebar .mascote { height: 64px; width: auto; flex: none; filter: drop-shadow(0 3px 6px rgba(7,26,58,.18)); }
    h1 { font-size: 19px; font-weight: 700; color: var(--brand-azul-institucional); line-height: 1.2; }
    h1 .uline { display: inline-block; height: 3px; width: 34px; background: var(--brand-amarelo);
      border-radius: 2px; margin-top: 6px; }
    .sub { font-size: 13px; font-weight: 500; color: var(--brand-azul-corporativo); opacity: .8; margin-top: 3px; }
    label { display: block; font-size: 12.5px; color: var(--brand-azul-corporativo); margin-bottom: 5px;
      font-weight: 600; letter-spacing: .2px; }
    input {
      width: 100%; padding: 11px 12px; border: 1.5px solid var(--brand-cinza-claro);
      border-radius: var(--radius-sm); font-size: 15px; margin-bottom: 14px;
      outline: none; transition: border .2s, box-shadow .2s;
      font-family: inherit; color: var(--brand-azul-institucional); background: #fff;
    }
    input::placeholder { color: #9fb0c7; }
    input:focus { border-color: var(--brand-azul-principal); box-shadow: 0 0 0 3px rgba(30,111,217,.15); }
    button.btn-gerar {
      width: 100%; padding: 13px; background: var(--brand-amarelo);
      color: var(--brand-azul-institucional);
      font-size: 15px; font-weight: 700; border: none; border-radius: var(--radius-sm);
      cursor: pointer; transition: background .2s, transform .05s; letter-spacing: .3px;
      font-family: inherit; box-shadow: var(--shadow-sm);
    }
    button.btn-gerar:hover { background: var(--brand-amarelo-suave); }
    button.btn-gerar:active { transform: translateY(1px); }
    .resultado { display: none; margin-top: 24px; text-align: center; }
    .dica {
      font-size: 12px; color: var(--brand-azul-corporativo); margin-bottom: 12px;
      background: #F0F4FA; border: 1px solid rgba(199,210,227,.7);
      border-radius: var(--radius-sm); padding: 9px 11px; font-weight: 500;
    }
    .qr-wrap { display: inline-block; background: #fff; border-radius: var(--radius-md);
      border: 1px solid var(--brand-cinza-claro); box-shadow: var(--shadow-sm); }
    .qr-label { margin-top: 12px; font-family: var(--font-primary); font-weight: 500;
      font-size: 14px; color: var(--brand-azul-institucional); line-height: 1.8; }
    button.btn-novo {
      margin-top: 16px; padding: 10px 24px; background: transparent;
      color: var(--brand-azul-principal); border: 1.5px solid var(--brand-azul-conexao);
      border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background .2s; font-family: inherit;
    }
    button.btn-novo:hover { background: rgba(63,169,245,.1); }
    .versao {
      margin-top: 20px; padding-top: 12px;
      border-top: 1px solid rgba(199,210,227,.35);
      text-align: center; font-size: 10px; font-weight: 300;
      letter-spacing: 1.2px; text-transform: none;
      color: var(--brand-azul-corporativo); opacity: .4;
    }

    /* ============ BLOCO DE IMPRESSAO (tela) ============ */
    .print-box {
      margin-top: 18px; padding: 12px; border-radius: var(--radius-sm);
      background: #F0F4FA; border: 1px solid rgba(199,210,227,.7); text-align: left;
    }
    .print-box .pb-title {
      font-size: 11.5px; font-weight: 700; color: var(--brand-azul-corporativo);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; text-align: center;
    }
    .print-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .print-row label { margin: 0; white-space: nowrap; }
    select.sel-dpi {
      flex: 1; padding: 8px 10px; border: 1.5px solid var(--brand-cinza-claro);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 13px;
      color: var(--brand-azul-institucional); background: #fff;
    }
    button.btn-print {
      width: 100%; padding: 12px; background: var(--brand-azul-principal); color: #fff;
      font-size: 14px; font-weight: 700; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-family: inherit; box-shadow: var(--shadow-sm);
      margin-bottom: 8px; transition: background .2s;
    }
    button.btn-print:hover { background: var(--brand-azul-conexao); }
    button.btn-zpl {
      width: 100%; padding: 11px; background: #fff; color: var(--brand-azul-corporativo);
      font-size: 13px; font-weight: 700; border: 1.5px solid var(--brand-cinza-claro);
      border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
      transition: border .2s, background .2s;
    }
    button.btn-zpl:hover { border-color: var(--brand-azul-conexao); background: #F7FAFF; }
    .status { margin-top: 10px; font-size: 11.5px; font-weight: 600; line-height: 1.45; min-height: 15px; }
    .status.ok   { color: #1B7F3B; }
    .status.err  { color: #B3261E; }
    .status.info { color: var(--brand-azul-corporativo); }

    /* pre-visualizacao da etiqueta em escala (100mm = 378px -> 90%) */
    .et-preview {
      width: 341px; height: 171px; overflow: hidden; margin: 0 auto 12px;
      border: 1px dashed var(--brand-cinza-claro); border-radius: 6px; background: #fff;
    }
    .et-preview .etiqueta { transform: scale(.9); transform-origin: top left; }

    /* ============ ETIQUETA FISICA: 100 mm x 50 mm ============
       Posicoes vem do objeto ET no script (mesmas coordenadas usadas
       no canvas do PNG e no ZPL) - por isso tudo aqui e absoluto.
       Tudo em preto puro: impressora termica nao faz meio-tom.     */
    .etiqueta {
      position: relative; width: 100mm; height: 50mm;
      background: #fff; color: #000; overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    .etiqueta > * { position: absolute; }
    .etiqueta .et-nome {
      font-weight: 700; text-align: center;
      white-space: nowrap; overflow: hidden;
    }
    .etiqueta .et-qr   { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #area-etiqueta { display: none; }

    @media print {
      @page { size: 100mm 50mm; margin: 0; }
