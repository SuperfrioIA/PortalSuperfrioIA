services:
  hub:
    build: .
    image: superfrio-hub:latest
    container_name: superfrio-hub
    ports:
      # HOST_PORT = porta publicada na VM. Default 8000; defina no .env se estiver ocupada.
      - "${HOST_PORT:-8000}:8000"
    environment:
      # Em prod, defina SUPERFRIO_JWT_SECRET no .env ou no host antes de subir.
      # Quando SUPERFRIO_ENV=prod, o startup falha se o secret continuar no default.
      SUPERFRIO_JWT_SECRET: ${SUPERFRIO_JWT_SECRET:-dev-secret-change-me}
      SUPERFRIO_ENV: ${SUPERFRIO_ENV:-dev}
      SUPERFRIO_DB_PATH: /app/data/portal.db
      # Banco: sem DATABASE_URL no .env, cai no SQLite do volume ./data (rollback do Lote 2).
      # Com DATABASE_URL=postgresql+psycopg://... aponta pro Postgres do service `db`.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/portal.db}
      # SSO Microsoft Entra ID (Degrau 3) — vazios = SSO desligado, só login local.
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_ALLOWED_GROUP_ID: ${ENTRA_ALLOWED_GROUP_ID:-}
      # Vazio = criacao automatica de cadastro DESLIGADA (cadastro previo
      # obrigatorio). ENTRA_AUTO_PROVISION=1 religa o JIT do primeiro login.
      ENTRA_AUTO_PROVISION: ${ENTRA_AUTO_PROVISION:-}
      # FTP de Processos Abertos (job diário) — sem usuário/senha no .env, o job
      # falha com KeyError ao tentar rodar (não impede o resto do Hub de subir).
      FTP_HOST: ${FTP_HOST:-ftp-sf.superfrio.com.br}
      FTP_PORT: ${FTP_PORT:-21}
      FTP_USER: ${FTP_USER:-}
      FTP_PASSWORD: ${FTP_PASSWORD:-}
      # Volumetria: fuso de exibição (as três telas) e primeiro dia com que a
      # tela do catering abre (transporte e estoque têm a abertura própria).
      VOLUMETRIA_FUSO_EXIBICAO: ${VOLUMETRIA_FUSO_EXIBICAO:-America/Sao_Paulo}
      VOLUMETRIA_ABERTURA_DE: ${VOLUMETRIA_ABERTURA_DE:-ano-corrente}
      # DW Oracle — fonte direta de volumetria_catering, volumetria_transporte e
      # volumetria_estoque (docs/PLANO_VOLUMETRIA_DW_DIRETO.md e
      # docs/PLANO_VOLUMETRIA_TRANSPORTE_ESTOQUE.md). Credencial de SOMENTE
      # LEITURA, só no .env da VM. Host/porta/serviço têm padrão no código e só
      # entram aqui para poderem ser trocados sem rebuild.
      DW_LEITURA_USUARIO: ${DW_LEITURA_USUARIO:-}
      DW_LEITURA_SENHA: ${DW_LEITURA_SENHA:-}
      DW_HOST: ${DW_HOST:-}
      DW_PORTA: ${DW_PORTA:-}
      DW_SERVICO: ${DW_SERVICO:-}
      # Volumetria de Catering (backend/volumetria_catering/) — mesma credencial
      # DW_LEITURA_* acima, duas tabelas (recebimento e expedição).
      DW_TABELA_REC: ${DW_TABELA_REC:-}
      DW_TABELA_EXP: ${DW_TABELA_EXP:-}
      # Volumetria de Transporte (backend/volumetria_transporte/) — mesma
      # credencial DW_LEITURA_* acima, tabela própria.
      DW_TABELA_TRN: ${DW_TABELA_TRN:-}
      # Volumetria de Estoque (backend/volumetria_estoque/) — idem.
      DW_TABELA_EST: ${DW_TABELA_EST:-}
      # SuperfrioIA (backend/ia/) — DESLIGADO por padrão: sem nada no .env o deploy não expõe
      # nada. A chave da Anthropic é digitada à mão no .env da VM (fora do Git, do chat e dos
      # scripts). A autoaprovação de concessão fica DESLIGADA aqui (DD-13: proibida antes do
      # piloto); ligar é uma decisão por ambiente. Vazio = vale o padrão do código.
      IA_HABILITADO: ${IA_HABILITADO:-false}
      IA_PROVEDOR: ${IA_PROVEDOR:-falso}
      IA_AUTOAPROVACAO: ${IA_AUTOAPROVACAO:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-}
      IA_ESFORCO: ${IA_ESFORCO:-}
      IA_INFERENCE_GEO: ${IA_INFERENCE_GEO:-}
      IA_COTA_DIA: ${IA_COTA_DIA:-}
      IA_TAM_PERGUNTA: ${IA_TAM_PERGUNTA:-}
      IA_MAX_CONSULTAS: ${IA_MAX_CONSULTAS:-}
      IA_MAX_OPERACOES_DW: ${IA_MAX_OPERACOES_DW:-}
      IA_MAX_PAGINAS: ${IA_MAX_PAGINAS:-}
      IA_MAX_PASSOS: ${IA_MAX_PASSOS:-}
      IA_MAX_SIMULTANEAS: ${IA_MAX_SIMULTANEAS:-}
      IA_DW_TIMEOUT_S: ${IA_DW_TIMEOUT_S:-}
      IA_TAM_RESULTADO: ${IA_TAM_RESULTADO:-}
      IA_MAX_TOKENS_SAIDA: ${IA_MAX_TOKENS_SAIDA:-}
      IA_RETENCAO_MENSAGENS_DIAS: ${IA_RETENCAO_MENSAGENS_DIAS:-}
      IA_RETENCAO_CONSULTAS_DIAS: ${IA_RETENCAO_CONSULTAS_DIAS:-}
      IA_VALIDADE_CONCESSAO_DIAS: ${IA_VALIDADE_CONCESSAO_DIAS:-}
      IA_TIMEOUT_S: ${IA_TIMEOUT_S:-}
      IA_PRAZO_PERGUNTA_S: ${IA_PRAZO_PERGUNTA_S:-}
      IA_TENTATIVAS: ${IA_TENTATIVAS:-}
      IA_REPAROS: ${IA_REPAROS:-}
      IA_PRECO_ENTRADA_USD_MTOK: ${IA_PRECO_ENTRADA_USD_MTOK:-}
      IA_PRECO_SAIDA_USD_MTOK: ${IA_PRECO_SAIDA_USD_MTOK:-}
      IA_PRECO_CACHE_LEITURA_USD_MTOK: ${IA_PRECO_CACHE_LEITURA_USD_MTOK:-}
      IA_PRECO_CACHE_ESCRITA_USD_MTOK: ${IA_PRECO_CACHE_ESCRITA_USD_MTOK:-}
      IA_CAMBIO_USD_BRL: ${IA_CAMBIO_USD_BRL:-}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: superfrio-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      # Default só pra dev. Em prod, defina POSTGRES_PASSWORD forte no .env (fora do git).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub-dev-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem `ports:` de propósito — o Postgres só é acessível pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-hub}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
