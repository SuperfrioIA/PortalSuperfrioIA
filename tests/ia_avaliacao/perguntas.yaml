- id: A16
  catalogo: 16
  tipo: atendida
  pergunta: "Qual o peso líquido dos cinco primeiros dias de cada mês, de janeiro a agosto de 2026?"
  gabarito: [{movimento: rec, lente: liq, de: "2026-01-01", ate: "2026-08-31", dias: [1, 2, 3, 4, 5]}]
  # a pergunta não diz entrada ou saída: dar as duas é legítimo (achado da 1ª rodada real)
  aceitar_tambem: [{movimento: exp, lente: liq, faixa: atendido, de: "2026-01-01", ate: "2026-08-31", dias: [1, 2, 3, 4, 5]}]
  # a resposta tem que DECLARAR o filtro aplicado (não basta repetir a pergunta: "primeiros" e "cinco" estão nela)
  esperar_texto_qualquer: ["dias 1 a 5", "dia 1 ao dia 5", "do dia 1 ao 5", "1º ao 5º", "1 a 5 de cada mês", "filtro de dia"]

- id: A17
  catalogo: 17
