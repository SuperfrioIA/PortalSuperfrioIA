  gabarito: [{movimento: exp, lente: pal, faixa: atendido, de: "2026-08-01", ate: "2026-08-31"}]
  esperar: []
  # a explicação do aviso da ferramenta, não a palavra "entrada" (que aparece em qualquer resposta)
  esperar_texto_qualquer: ["só existe na entrada", "somente na entrada", "apenas na entrada", "existe apenas na entrada",
                           "só existe para a entrada", "não existe para a saída", "não existe na saída",
                           "só tem a medida de pallets", "essa medida não existe", "só tem pallets na entrada"]

