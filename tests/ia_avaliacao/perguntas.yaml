# Catálogo de avaliação do Lote 3: as perguntas do contrato (docs/CONTRATO_IA_VOLUMETRIA_CATERING.md §5)
# com a resposta esperada. O DW é o SINTÉTICO de tests/dw_falso.py ("hoje" = 2026-09-06; entrada
# atualizada até 05/09, saída até 03/09; setembro é mês incompleto).
#
# GABARITO = parâmetros no vocabulário do adaptador, executados pelo PRÓPRIO serviço
# (backend/ia/adaptadores): o número esperado vem da mesma função que a tela usa, nunca de uma
# conta feita aqui. `oraculo` confere o gabarito contra a soma por laço de dw_falso.soma_t (independente do Hub).
#
# Campos de cada passo (uma pergunta ou cada item de `turnos`):
#   pergunta                      texto enviado
#   gabarito                      lista de parâmetros de consultar_indicador, OU {ferramenta: descrever}
#   esperar                       seletores do resultado do gabarito cujos números o texto precisa trazer
#                                 (padrão: total_por_mes.*.valor e total_do_periodo.valor). [] = nenhum
#   esperar_numeros               números literais que o texto precisa trazer (ex.: anos)
#   esperar_texto_de              seletores cujo TEXTO (rótulos) o texto precisa trazer
#   esperar_texto                 trechos que o texto precisa conter (todos)
#   esperar_texto_qualquer        o texto precisa conter pelo menos um destes trechos
#   esperar_lista                 unidade | operacao: todos os valores do domínio precisam aparecer
#   esperar_aguardando_base       a resposta precisa parar para perguntar a base (DD-11), sem percentual
#   proibir_texto                 trechos que NÃO podem aparecer
#   sem_consulta_ok               nenhuma consulta ao indicador pode ter dado certo
#   oraculo                       {meses, k, unidades?, operacoes?}: confere o gabarito contra dw_falso.soma_t
# `tipo`: atendida | recusada | seguranca
# Itens omitidos de propósito: catálogo 4 na forma "por unidade" (gabarito não é único; está como A04 agregado).

- id: A01
  catalogo: 1
  tipo: atendida
  pergunta: "Quanto de peso líquido entrou em agosto de 2026?"
  gabarito: [{movimento: rec, lente: liq, de: "2026-08-01", ate: "2026-08-31"}]
  oraculo: {meses: ["2026-08"], k: 0}

